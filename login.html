<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartlodge Registration</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .login-body {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .login-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .login-left-section {
            flex: 1;
            background-image: url("ghiblilogin.jpg");
            background-size: cover;
            background-position: center;
            min-width: 0;
            min-height: 0;
            height: 100vh;
            padding: 0;
            margin: 0;
        }
        .login-right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
            height: 100vh;
            min-width: 0;
            min-height: 0;
            padding: 0;
            margin: 0;
            box-shadow: -5px 0 10px rgba(0, 0, 0, 0.1);
        }



        .login-body * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
         font-family: Arial, sans-serif;
        }

        .login-body h1 {
            font-size: 28px;
    margin-bottom: 10px;
}

.login-body h2 {
    font-size: 20px;
    margin-bottom: 20px;
}



form {
    display: flex;
    flex-direction: column;
    width: 100%;
   
    max-width: 350px;
}

.login-body input,.login-body select {
    padding: 14px;
    margin: 10px 0;
    border: 2px solid #ccc;
    border-radius: 6px;
    font-size:16px; 
}

.create-btn {
    background: #236003;
    margin-top:200px;
    color: white;
    padding: 10px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 10px;
}

.cancel-btn {
    background: #f8f8f8;
    color: #333;
    padding: 10px;
    border: 1px solid #ccc;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 10px;
}

.create-btn:hover {
    background: #236003;
}

.cancel-btn:hover {
    background: #e0e0e0;
}

.login-text {
    margin-top: 20px;
    font-size: 14px;
}

.login-text a {
    color: #236003;
    text-decoration: none;
}

</style>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-left-section">    
           
        </div>
        <div class="login-right-section">
            <h1></h1>
            <h2>Login</h2>
            <form action="login.php" method="POST">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="create-btn">Login</button>
                <button type="button" class="cancel-btn" onclick="window.location.href='index.html'">Cancel</button>
            </form>
            <p class="login-text">Don't have an Account??<a href="register.html">Register.</a></p>
        </div>
    </div>
    
</body>
</html>
